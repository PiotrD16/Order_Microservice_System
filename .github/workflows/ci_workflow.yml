name: Java CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile, run tests and Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Run SonarQube analysis
        if: ${{ vars.SONAR_HOST_URL != '' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.projectName=${{ github.repository }}

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/java/openjdk
        with:
          project: ${{ github.event.repository.name }}
          path: "."
          format: "HTML"
          out: "reports"
          args: '--failOnCVSS 7'

      - name: Build Docker Image
        run: docker build -t local_app:test .

      - name: Verify Docker artifact runtime
        run: |
          docker run -d --name app-smoke-test -p 8080:8080 local_app:test
          
          sleep 15
          
          if [ "$(docker inspect -f '{{.State.Running}}' app-smoke-test)" = "false" ]; then
            echo "ERROR! Container crashed unexpectedly... Detailed log saved to logs"
            docker logs app-smoke-test
            exit 1
          fi
          
          echo "SUKCES: Aplikacja uruchomiła się poprawnie."
          docker stop app-smoke-test && docker rm app-smoke-test
